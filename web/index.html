<!doctype html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Olist Dispute Console — Multi-Agent A2A</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231c5cab'/><path d='M8 20l5-6 4 4 7-8' stroke='%23fff' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <h1>Olist Dispute Console</h1>
      <span class="sub">EC_POLICY_V1</span>
    </div>
    <nav class="views">
      <button data-view="cases" aria-current="true">Hồ sơ</button>
      <button data-view="overview">Tổng quan</button>
      <button data-view="architecture">Kiến trúc</button>
    </nav>
    <div class="topstats" id="topstats"></div>
    <button class="icon-btn" id="themeToggle" title="Đổi giao diện sáng/tối">Sáng</button>
  </header>

  <main>
    <!-- ============================ CASES ============================ -->
    <div class="view" data-view="cases" data-active="true">
      <aside class="caselist">
        <div class="listhead">
          <input id="search" type="search" placeholder="Tìm case ID, order ID, nội dung…" autocomplete="off">
          <div class="filters" id="filters"></div>
        </div>
        <div class="rows" id="rows"></div>
      </aside>

      <section class="detail">
        <div class="detailhead" id="detailhead">
          <div class="line1"><h2>—</h2></div>
        </div>
        <div class="tabs" id="tabs">
          <button data-tab="verdict" aria-current="true">Kết luận</button>
          <button data-tab="flow">Luồng A2A</button>
          <button data-tab="data">Dữ liệu gốc</button>
          <button data-tab="json">Output JSON</button>
        </div>
        <div class="pane" id="pane-verdict"></div>
        <div class="pane" id="pane-flow" hidden></div>
        <div class="pane" id="pane-data" hidden></div>
        <div class="pane" id="pane-json" hidden></div>
      </section>
    </div>

    <!-- =========================== OVERVIEW =========================== -->
    <div class="view" data-view="overview">
      <div class="overview" id="overviewBody"></div>
    </div>

    <!-- ========================= ARCHITECTURE ========================= -->
    <div class="view" data-view="architecture">
      <div class="overview" id="archBody"></div>
    </div>
  </main>
</div>

<div id="tooltip" role="tooltip"></div>
<script src="/static/app.js"></script>
</body>
</html>
